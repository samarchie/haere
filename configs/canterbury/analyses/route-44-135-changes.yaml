schema_version: 1
id: route-44-135-changes

metadata:
  title: "Route 44/135 Metro Review"
  description: |
    Environment Canterbury's Metro Review 44/135 proposed removing Route
    135 (New Brighton to The Palms) and extending Route 44 to cover part
    of its corridor. Route 135 is one of Metro's lowest-used services,
    currently serving Burwood Hospital, Taiora QEII, and two high schools;
    removing it frees up funding to extend Route 44 up Marshland Road and
    into the Prestons loop, cut the Ravensdale Rise loop in Westmorland,
    add layover time for reliability, and roughly double weekend
    frequency with extended evening hours (last bus ~11pm Saturday, ~10pm
    Sunday). Passengers on Route 135 would need to use Routes 60, 80, 7,
    or school services 666, 668, and 669 instead. Feedback closed on 24
    June 2026; a council report is due in August 2026, with a final
    decision expected late 2026.

    ![Existing network map](images/existing-network-map.jpg) ![Proposed network map](images/proposed-network-map.jpg)
  sources:
    - name: "Environment Canterbury GTFS"
      published: "2026-06-01"
  consultation:
    closes_at: "2026-06-24T23:59:00+12:00"
    url: "https://haveyoursay.ecan.govt.nz/metroreview44-135"

