repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome-check
        name: biome check (frontend)
        entry: bash -c 'cd frontend && npx --yes @biomejs/biome check --write .'
        language: system
        files: ^frontend/
        pass_filenames: false