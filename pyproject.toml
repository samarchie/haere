[project]
name = "haere"
version = "0.0.1"
description = "A tool to show how proposed changes to the public transport network affect travel times."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "analysis"}

[tool.ruff]
target-version = "py314" 

[tool.ruff.lint]
# Enable the isort (I) rules alongside defaults
extend-select = ["I"]
