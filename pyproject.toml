[project]
name = "ara"
version = "0.1.0"
description = "A tool to show how proposed changes to the public transport network affect travel times."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

[tool.ruff]
target-version = "py314" 

[tool.ruff.lint]
# Enable the isort (I) rules alongside defaults
extend-select = ["I"]
