[project]
name = "haere"
version = "0.0.1"
description = "A tool to show how proposed changes to the public transport network affect travel times."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "geopandas>=1.1.4",
    "h3>=4.5.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "r5py>=1.1.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "r5py-sampledata-helsinki>=1.1.1",
]

[project.scripts]
haere = "backend.main:cli"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
target-version = "py314" 

[tool.ruff.lint]
# Enable the isort (I) rules alongside defaults
extend-select = ["I"]

[tool.pytest.ini_options]
addopts = "-v --cov=backend --cov-report=term-missing --tb=short"
markers = [
    "jvm: starts a real JVM through r5py. Slow and skipped by default; run with `RUN_JVM_TESTS=1 uv run pytest backend/tests/test_jvm.py`.",
]

[tool.coverage.run]
omit = ["backend/tests/*", "test_*.py"]
